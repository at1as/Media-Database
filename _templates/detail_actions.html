<div class="button-container">
  {% set trailer = media.trailer_url | imdb_trailer_url %}
  {% if trailer %}
    <a href="{{ trailer }}" target="_blank" rel="noopener noreferrer" class="imdb-button trailer-button">See trailer</a>
  {% endif %}
  {% set imdb_url = media.url | imdb_title_url %}
  {% if imdb_url %}
    <a href="{{ imdb_url }}" target="_blank" class="imdb-button">Go to IMDB</a>
  {% endif %}
</div>
