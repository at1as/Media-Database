<label class="theme-toggle">
  <input class="sr-only" type="checkbox" id="darkModeToggle" role="switch" aria-label="Dark mode" autocomplete="off">
  <span class="theme-toggle-track" aria-hidden="true">
    <span class="theme-toggle-sun">☀︎</span>
    <span class="theme-toggle-moon">☾</span>
  </span>
</label>
