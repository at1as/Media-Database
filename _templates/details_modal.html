<div id="backdrop" style="display:none" onclick="if (event.target === this) close_details()">
  <div id="modal-alert" class="centered" role="dialog" aria-modal="true" aria-label="Title details">
    <button type="button" id="modal-prev-btn" onclick="navigate_modal('prev')" aria-label="Previous title" title="Previous (←)">‹</button>
    <button type="button" id="modal-next-btn" onclick="navigate_modal('next')" aria-label="Next title" title="Next (→)">›</button>
    <button type="button" id="modal-close-btn" onclick="close_details()" aria-label="Close details" title="Close (Esc)">×</button>
  </div>
</div>
